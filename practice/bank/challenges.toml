# Multi-step challenges. Source file for the question bank.
[[question]]
id = "Q220"
question = '''Summarize a year of retail.csv the way a first analysis brief would: net revenue, the cost of cancellations, the best and worst months, the leading category and how much repeat business there is.'''
answer = '''One function returning a dictionary, built from the primitives of the earlier exercises: net revenue is a plain sum because cancellations are negative; the cancellation share is the cancelled revenue against gross; months and categories are groupbys; repeat business is the share of identified customers with more than one distinct invoice. Strong solutions state the grain before every aggregate and say which figures the missing customer IDs cannot support.'''
chapters = [1, 4, 11, 12]
level = "intermediate"
type = "coding"
exercise = "challenges/q220-a-year-of-retail-in-one-function"
dataset = "retail.csv"

[[question]]
id = "Q221"
question = '''Build a logistic-regression baseline for attrition in hr.csv with a proper split, and report what it beats.'''
answer = '''A stratified 80/20 split with a fixed random_state, a majority-class accuracy on the test set as the floor, and a Pipeline (one-hot for the two text columns, scaling for the numbers, LogisticRegression) fitted on the training rows only. Report accuracy and ROC AUC on the test rows. Strong solutions notice that accuracy barely beats the 88% floor because attrition is rare, and that AUC is the more honest number here.'''
chapters = [14, 16, 22]
level = "intermediate"
type = "coding"
exercise = "challenges/q221-an-honest-attrition-baseline"
dataset = "hr.csv"

[[question]]
id = "Q222"
question = '''Train a fraud classifier on transactions.csv and pick the decision threshold that reaches a required recall, then report what it costs in precision.'''
answer = '''Stratified split, a scaled logistic regression with class_weight='balanced' because fraud is under half a percent of rows, then a search over thresholds on the test-set probabilities: the highest threshold whose recall is at least 0.80, and the precision at that point. The 0.5 default is reported beside it to show that the threshold is a business decision, not a constant (Q98). Strong solutions choose the threshold on a validation set rather than the test set in real work, and say so.'''
chapters = [22, 23]
level = "advanced"
type = "coding"
exercise = "challenges/q222-choosing-a-fraud-threshold"
dataset = "transactions.csv"

[[question]]
id = "Q223"
question = '''Measure how much a leaky preprocessing step changes a cross-validated score on customers.csv, by running the same model with and without the leak.'''
answer = '''Two cross-validations of the same estimator on the same folds: one where imputation and scaling live inside a Pipeline, so each fold fits them on its own training rows, and one where they are fitted once on all the data before cross_val_score sees it. Strong solutions explain why the second is leakage even if the numbers barely move here (Q85), and why the honest version is the only one whose score predicts deployment.'''
chapters = [16, 24, 25]
level = "intermediate"
type = "coding"
exercise = "challenges/q223-leakage-in-preprocessing-measured"
dataset = "customers.csv"

[[question]]
id = "Q224"
question = '''Hold out the last 90 days of daily revenue and measure three baselines any forecasting model has to beat: the training mean, the last value, and the seasonal naive.'''
answer = '''A chronological holdout, never a random one (Q46). The mean baseline predicts the training mean everywhere; the naive baseline repeats the last training day; the seasonal naive repeats the last training week in a cycle, because daily revenue has a weekly pattern. Report the MAE of each and which wins. Strong solutions say that a model which does not beat the seasonal naive has learned nothing the calendar did not already know.'''
chapters = [28]
level = "intermediate"
type = "coding"
exercise = "challenges/q224-forecast-baselines-that-must-be-beaten"
dataset = "daily_revenue.csv"

[[question]]
id = "Q225"
question = '''Cluster segments.csv with k-means and measure the result two ways: against the true segment labels and without them.'''
answer = '''Standardize the four features first, because k-means measures Euclidean distance and the columns are on different scales; KMeans(n_clusters=4, n_init=10, random_state=0); then adjusted Rand index against TrueType, which is available only because the data is synthetic, and silhouette score, which is what you have in real work. Strong solutions say why the unclassifiable rows pull both numbers down and why silhouette alone cannot tell you the clusters are meaningful (Q112).'''
chapters = [26, 27]
level = "intermediate"
type = "coding"
exercise = "challenges/q225-do-the-clusters-mean-anything"
dataset = "segments.csv"

[[question]]
id = "Q226"
question = '''Build an RFM table for the identified customers in retail.csv, score each dimension into quartiles, and count the top segment.'''
answer = '''One row per customer: recency as days from the last purchase to the day after the data ends, frequency as distinct invoices, monetary as net revenue; then quartile scores 1 to 4 with pd.qcut on a rank, because many customers tie on frequency and qcut on raw values would fail. Recency scores in reverse: the most recent buyers get 4. Strong solutions justify the reference date, exclude the rows without a CustomerID, and say that segment counts depend entirely on the cut rule.'''
chapters = [4, 11, 26]
level = "advanced"
type = "coding"
exercise = "challenges/q226-recency-frequency-monetary"
dataset = "retail.csv"

[[question]]
id = "Q227"
question = '''Compare attrition between employees who work overtime and those who do not, with a confidence interval and a p-value, and say what the numbers do and do not show.'''
answer = '''Two proportions, their difference, a normal-approximation 95% interval for the difference, and a two-sided z-test with a pooled standard error. The interval is the useful output; the p-value only says the difference is unlikely to be zero. Strong solutions say plainly that this is observational: overtime and attrition can share a cause, so the interval is not the effect of overtime (Q36).'''
chapters = [8, 15, 42]
level = "intermediate"
type = "coding"
exercise = "challenges/q227-is-the-overtime-effect-real"
dataset = "hr.csv"
