# Machine learning fundamentals. Source file for the question bank: edit here, then run python scripts/build_practice.py.

[[question]]
id = "Q40"
question = '''When would you choose not to use machine learning?'''
answer = '''Strong answers name concrete conditions: the rules are already known and stable, data is scarce, errors are intolerable or must be fully explained, or latency and cost budgets rule out a model. The best answers add that a rules-based or statistical solution is easier to audit and maintain.'''
chapters = [1]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q41"
question = '''Explain the difference between supervised, unsupervised, and reinforcement learning.'''
answer = '''Supervised has labeled input-output pairs and learns a predictor; unsupervised has inputs only and finds structure such as clusters or low-dimensional representations; reinforcement learning has an environment and reward signal and learns a policy through interaction. Naming one real use case for each is expected.'''
chapters = [1, 37]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q42"
question = '''What is a baseline model and why does it matter?'''
answer = '''A trivially simple predictor — majority class, mean, or the incumbent business rule — that establishes the score a real model must beat. It quantifies the value the model actually adds and frequently reveals that a complex model adds nothing.'''
chapters = [1, 15]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q43"
question = '''What does it mean for a model to generalize?'''
answer = '''That it performs well on data drawn from the same distribution but not used in training. Strong answers distinguish memorization from generalization and mention held-out evaluation as the only way to estimate it.'''
chapters = [16]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q44"
question = '''Give three concrete examples of data leakage.'''
answer = '''Expected answers include a feature populated only after the outcome occurs, fitting a scaler or imputer before splitting, target encoding computed over the full dataset, and duplicate or near-duplicate rows on both sides of the split. Strong answers add that the symptom is implausibly good validation performance.'''
chapters = [16, 11, 24]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q45"
question = '''Why cross-validate instead of using a single train-test split?'''
answer = '''A single split gives a high-variance estimate that depends on which rows landed where. Cross-validation averages over k splits, uses all data for both training and validation, and provides a spread across folds that indicates estimate stability.'''
chapters = [16]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q46"
question = '''How do you split time-series data, and why is random k-fold invalid?'''
answer = '''Split chronologically, training on the past and validating on the future, often with forward-chaining or expanding windows. Random folds let the model learn from future observations, which inflates performance and cannot be reproduced at prediction time.'''
chapters = [16, 28]
level = "intermediate"
type = "conceptual"
related = ["Q106"]

[[question]]
id = "Q47"
question = '''Why keep a validation set and a test set rather than one holdout?'''
answer = '''Validation guides decisions — hyperparameters, features, model choice — and can be consulted repeatedly. The test set estimates final performance and should be used once, because every look spends some of its independence.'''
chapters = [16, 25]
level = "beginner"
type = "conceptual"
related = ["Q104"]

[[question]]
id = "Q48"
question = '''Explain the bias-variance tradeoff.'''
answer = '''Expected error decomposes into squared bias, variance, and irreducible noise; simple models have high bias and low variance, flexible models the reverse. A strong answer ties it to a diagnostic — the gap between training and validation error — rather than reciting the definition.'''
chapters = [17]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q49"
question = '''What is the difference between L1 and L2 regularization?'''
answer = '''L1 penalizes absolute values, producing sparsity and implicit feature selection; L2 penalizes squared values, shrinking smoothly and handling correlated features better. Bonus for explaining why L1’s corner yields exact zeros, or the Laplace-versus-Gaussian prior framing.'''
chapters = [17]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q50"
question = '''Name five ways to combat overfitting.'''
answer = '''More data, stronger regularization, fewer features, early stopping, dropout, data augmentation, ensembling. The best answers first ask whether training error is low — if it is not, the problem is bias, not variance.'''
chapters = [17, 16]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q51"
question = '''Your model has 99% training accuracy and 71% validation accuracy. What do you do?'''
answer = '''Name it as high variance, then act: more data, stronger regularization, less capacity, early stopping, or check for a distribution mismatch. Also verify the split is sound and no duplicate rows inflate the training figure.'''
chapters = [16, 17]
level = "beginner"
type = "scenario"
