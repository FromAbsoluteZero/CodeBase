# Mathematics and statistics. Source file for the question bank: edit here, then run python scripts/build_practice.py.

[[question]]
id = "Q19"
question = '''Explain broadcasting in NumPy.'''
answer = '''NumPy aligns shapes from the trailing dimension backward; dimensions are compatible if equal or if one is 1, and size-1 dimensions are stretched. A strong answer gives an example of the silent (3,1) plus (1,3) producing (3,3), and notes that broadcasting avoids materializing large intermediate arrays.'''
chapters = [9, 4]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q20"
question = '''What is a dot product, geometrically?'''
answer = '''The product of the two vectors’ magnitudes times the cosine of the angle between them — a measure of alignment. Strong answers connect it to cosine similarity for embeddings and note that a zero dot product means orthogonality.'''
chapters = [9]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q21"
question = '''What is the computational complexity of multiplying two n by n matrices?'''
answer = '''The naive algorithm is O(n^3). Candidates may mention Strassen’s algorithm and subsequent theoretical improvements, but the practical answer is that libraries use highly optimized blocked O(n^3) implementations.'''
chapters = [9]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q22"
question = '''Why should you avoid explicitly inverting a matrix in code?'''
answer = '''Inversion is slower and numerically unstable, particularly when the matrix is ill-conditioned. Solving the system directly with a factorization is both faster and more accurate; scikit-learn and NumPy solvers do this internally.'''
chapters = [9, 13]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q23"
question = '''What is a gradient, and why do we move against it?'''
answer = '''It is the vector of partial derivatives, pointing in the direction of steepest increase of the loss. Since the goal is to reduce loss, updates move in the negative gradient direction, scaled by the learning rate.'''
chapters = [10]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q24"
question = '''State the chain rule and explain its role in neural networks.'''
answer = '''The derivative of f(g(x)) is f’(g(x)) times g’(x). A network is a composition of layers, so the chain rule propagates the loss derivative backward through each layer; backpropagation is its systematic application with intermediate values cached.'''
chapters = [10, 30]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q25"
question = '''How would you check whether your gradient implementation is correct?'''
answer = '''Compare against a numerical finite-difference estimate, preferably central difference with a step around 1e-5, and confirm agreement to within a small tolerance. Strong answers mention that too small a step introduces rounding error.'''
chapters = [10, 30]
level = "intermediate"
type = "conceptual"
related = ["Q80"]

[[question]]
id = "Q26"
question = '''What is the difference between a local minimum and a saddle point, and which matters more in deep learning?'''
answer = '''Both have zero gradient; a saddle increases in some directions and decreases in others. In high dimensions saddles dominate, and much of modern optimizer design is about escaping them efficiently.'''
chapters = [10, 18]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q27"
question = '''Explain Bayes’ theorem and give a concrete example.'''
answer = '''Posterior equals likelihood times prior over evidence. The expected example is a rare-disease test where most positives are false because the prior is tiny; reasoning with hypothetical counts rather than percentages is the clearest presentation.'''
chapters = [7]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q28"
question = '''What does a p-value actually mean?'''
answer = '''The probability of data at least as extreme as observed, assuming the null hypothesis is true. Strong answers explicitly reject the common misreading and note that a p-value says nothing about effect size or practical importance.'''
chapters = [8]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q29"
question = '''What is maximum likelihood estimation, and how does it relate to loss functions?'''
answer = '''Choose parameters maximizing the probability of the observed data. Taking the negative log-likelihood produces a loss; Gaussian noise yields squared error and a Bernoulli outcome yields cross-entropy, which is why those losses appear everywhere.'''
chapters = [7, 14]
level = "advanced"
type = "conceptual"

[[question]]
id = "Q30"
question = '''Likelihood and probability sound interchangeable. What separates them?'''
answer = '''Probability fixes parameters and varies data; likelihood fixes data and varies parameters. The likelihood function is not a distribution over parameters and does not integrate to one.'''
chapters = [7]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q31"
question = '''What does a 95% confidence interval mean?'''
answer = '''That the procedure producing it captures the true value in 95% of repeated samples. Strong answers explicitly reject the common reading — it is not a 95% probability that this particular interval contains the parameter — and note the interval says nothing about practical importance.'''
chapters = [8]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q32"
question = '''A test returns p = 0.12. Your manager concludes the two options are identical. Respond.'''
answer = '''Absence of evidence is not evidence of absence. Strong answers ask what effect size the test could have detected: with a small sample, p = 0.12 is consistent with a large real difference. Report the confidence interval, which shows the range of effects still compatible with the data.'''
chapters = [8]
level = "intermediate"
type = "scenario"

[[question]]
id = "Q33"
question = '''When does the mean mislead, and what do you report instead?'''
answer = '''Under skew or heavy tails, where a few extreme values pull it away from any typical case. Strong answers name the median plus a spread measure, and note that the mean is still correct for totals — revenue per customer times customers is a real number even when no customer is average.'''
chapters = [6]
level = "beginner"
type = "conceptual"

[[question]]
id = "Q34"
question = '''A test is 95% accurate for a condition affecting 1 in 500. Someone tests positive. What is the chance they have it?'''
answer = '''Around 3.7%, and the reasoning matters more than the figure. Strong answers work in counts: out of 100,000 people, 200 have it and about 190 test positive, while 99,800 do not and about 4,990 test positive anyway. False positives swamp true ones whenever the base rate is low.'''
chapters = [7, 14, 22]
level = "intermediate"
type = "scenario"

[[question]]
id = "Q35"
question = '''Why is the central limit theorem the reason inference works?'''
answer = '''Because it makes the sampling distribution of the mean approximately normal regardless of the population's shape, given enough observations, which is what licenses standard errors and confidence intervals on data that is not itself normal. Strong answers note it applies to the statistic, not the data, and that heavy tails slow the convergence.'''
chapters = [7, 8]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q36"
question = '''What is the difference between correlation and causation, in practice?'''
answer = '''Correlation is a measurable property of data; causation is a claim about what would happen under intervention. Strong answers name the practical routes to the second — randomization, or a design exploiting quasi-random variation — and note that controlling for observed confounders does not establish it.'''
chapters = [15, 13]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q37"
question = '''You test 15 segments and two come back significant. What do you conclude?'''
answer = '''Probably nothing. At a 5% threshold, testing 15 independent segments gives a greater than 50% chance of at least one false positive. Strong answers name a correction, or better, propose treating the finding as a hypothesis to be confirmed on fresh data.'''
chapters = [8]
level = "intermediate"
type = "scenario"

[[question]]
id = "Q38"
question = '''How do you determine the sample size for an A/B test?'''
answer = '''From the minimum effect worth detecting, the baseline rate, the tolerance for false positives and false negatives, and the variance. Strong answers stress that the effect size is a business decision made before the test, and that computing it afterward to justify a result is meaningless.'''
chapters = [15]
level = "intermediate"
type = "conceptual"

[[question]]
id = "Q39"
question = '''Why is checking test results daily a problem?'''
answer = '''Because stopping the moment the result crosses significance inflates the false positive rate far above the nominal level — a random walk crosses any boundary eventually. Strong answers name a fixed horizon set in advance, or a sequential method designed to permit peeking.'''
chapters = [15]
level = "intermediate"
type = "conceptual"
