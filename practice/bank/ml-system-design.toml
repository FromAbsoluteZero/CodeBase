[[question]]
id = "Q166"
question = '''How would you serve a model with a 50 millisecond latency budget?'''
answer = '''Budget the whole path, not just inference: network, feature retrieval, model, and overhead. Levers include caching, precomputed features, batching, quantization, distillation, and dropping to a smaller model with a fallback.'''
chapters = [43]
level = "advanced"
type = "scenario"

[[question]]
id = "Q167"
question = '''How do you decide between batch and online inference?'''
answer = '''Batch when predictions can be precomputed and freshness in hours is acceptable; online when inputs are only known at request time. Batch is cheaper and simpler to monitor, so it should be the default.'''
chapters = [43]
level = "intermediate"
type = "scenario"
